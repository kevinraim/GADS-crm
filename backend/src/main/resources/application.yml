spring:
  application:
    name: crm-ferretero
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/crm_ferretero}
      auto-index-creation: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:cambia-este-secreto-por-uno-de-al-menos-32-caracteres}
    vencimiento-minutos: ${JWT_VENCIMIENTO_MINUTOS:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${APP_SEED_ENABLED:true}

logging:
  level:
    ar.edu.unlam.crmferretero: INFO
